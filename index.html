<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Adriaan Cloet</title>
		<meta name="google-site-verification" content="HWzMFcjCRcZRgSnsg9k3yuoabCAAh3flnMgDj1Bm91g" />
		<style>
			:root {
				color-scheme: light dark;
				--text: #1d1d1f;
				--text-secondary: #6e6e73;
				--surface: #ffffff;
				--accent-text: #0066cc;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--text: #f5f5f7;
					--text-secondary: #a1a1a6;
					--surface: #1c1c1e;
					--accent-text: #4da3ff;
				}
			}
			body {
				margin: 0;
				background: var(--surface);
				color: var(--text);
				font-family: 'Segoe UI', system-ui, -apple-system, 'Ubuntu Sans', Ubuntu, sans-serif;
				font-size: 17px;
				line-height: 1.55;
			}
			main {
				max-width: 680px;
				margin: 0 auto;
				padding: 56px 20px;
			}
			h1 {
				margin: 0 0 12px;
				font-size: 32px;
			}
			p {
				color: var(--text-secondary);
			}
			a {
				color: var(--accent-text);
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Adriaan Cloet</h1>
			<p>Projects:</p>
			<ul>
				<li>
					<a href="/SimpleCalendar/">SimpleCalendar</a>, a lightweight, local-first desktop
					calendar (<a href="/SimpleCalendar/privacy.html">privacy policy</a>)
				</li>
			</ul>
		</main>
	</body>
</html>
